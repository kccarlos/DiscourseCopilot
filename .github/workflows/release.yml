name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.zip.outputs.zip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches versions
        id: version
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG.replace(/^v/, "");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version;
            const p = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            if (m !== p) { console.error(`::error::manifest.json=${m} but package.json=${p}`); process.exit(1); }
            if (tag !== m) { console.error(`::error::Tag ${process.env.TAG} does not match manifest.json version ${m}`); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${m}\n`);
          '

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package extension
        id: zip
        run: |
          test -f dist/manifest.json
          ZIP="discourse-copilot-${{ steps.version.outputs.version }}.zip"
          (cd dist && zip -r -X "../$ZIP" .)
          unzip -l "$ZIP" | grep -E '\smanifest\.json$'
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "${{ steps.zip.outputs.zip }}" \
            --title "$TAG" --generate-notes --verify-tag

      - name: Upload zip for publish job
        uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: ${{ steps.zip.outputs.zip }}
          retention-days: 7
          if-no-files-found: error

  chrome-web-store:
    # Uploads the release zip with the Chrome Web Store API v2, signing in to
    # Google Cloud through Workload Identity Federation (no stored keys). The
    # provider only trusts tag pushes from this repository, so the job is
    # skipped for manual runs.
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      ITEM_ID: ${{ vars.CWS_ITEM_ID }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
      ZIP: ${{ needs.release.outputs.zip }}
    steps:
      - name: Check Chrome Web Store configuration
        id: check
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ] && [ -n "$ITEM_ID" ] && [ -n "$PUBLISHER_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome Web Store publishing is not configured; skipping store upload."
          fi

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.enabled == 'true'
        with:
          name: extension-zip

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.check.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s

      - name: Upload to Chrome Web Store
        if: steps.check.outputs.enabled == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          ITEM="publishers/$PUBLISHER_ID/items/$ITEM_ID"
          API="https://chromewebstore.googleapis.com"

          HTTP=$(curl -sS -o upload.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ZIP" \
            "$API/upload/v2/$ITEM:upload?uploadType=media")
          jq . upload.json || cat upload.json
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Chrome Web Store upload failed (HTTP $HTTP)"; exit 1
          fi

          STATE=$(jq -r '.uploadState // empty' upload.json)
          for i in $(seq 1 30); do
            [ "$STATE" = "IN_PROGRESS" ] || break
            sleep 10
            STATE=$(curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
              "$API/v2/$ITEM:fetchStatus" | jq -r '.lastAsyncUploadState // empty')
            echo "Upload state: $STATE"
          done
          if [ "$STATE" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store upload did not succeed (uploadState=${STATE:-none})"; exit 1
          fi
          echo "::notice::Uploaded $ZIP to the Chrome Web Store."

      - name: Submit for review
        if: steps.check.outputs.enabled == 'true' && env.AUTO_PUBLISH == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o publish.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$ITEM_ID:publish")
          jq . publish.json || cat publish.json
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Chrome Web Store submission failed (HTTP $HTTP)"; exit 1
          fi
          echo "::notice::Submitted for review (state: $(jq -r '.state // "unknown"' publish.json))."

      - name: Draft only
        if: steps.check.outputs.enabled == 'true' && env.AUTO_PUBLISH != 'true'
        run: echo "::notice::Uploaded as a draft. Submit it for review in the developer dashboard, or set the repository variable CWS_AUTO_PUBLISH to true."
