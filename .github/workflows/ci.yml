name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version read from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check manifest.json / package.json versions match
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version;
            const p = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            if (m !== p) {
              console.error(`::error::Version mismatch: manifest.json=${m} package.json=${p}`);
              process.exit(1);
            }
            console.log(`Version ${m} is consistent`);
          '

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: test -f dist/manifest.json || { echo "::error::dist/manifest.json missing"; exit 1; }

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
