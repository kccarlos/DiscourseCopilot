name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: forum
    attributes:
      label: Forum URL
      description: The Discourse forum (and topic, if relevant) where it happened. Leave out private forums if you prefer.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: AI provider and model
      description: e.g. OpenRouter / anthropic/claude-sonnet-5. Never paste your API key.
  - type: textarea
    id: logs
    attributes:
      label: Errors or console output
      description: From the side panel (right-click → Inspect → Console) or the service worker on chrome://extensions. Remove anything private.
      render: text
