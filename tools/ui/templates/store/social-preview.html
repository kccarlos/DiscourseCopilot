<!doctype html>
<!-- GitHub social preview (1280x640, Settings → Social preview): the marquee
     promo tile re-laid for 2:1. Rendered by tools/ui/store-shots.mjs; the two
     cards are side-panel captures from /panels/. -->
<html><head><meta charset="utf-8"><title>Social preview</title><link rel="stylesheet" href="/templates/store/promo.css"><style>
.tile { width: 1280px; height: 640px; display: flex; }
.left { width: 660px; padding: 0 0 0 72px; display: flex; flex-direction: column; justify-content: center; }
.left img { width: 440px; height: auto; display: block; margin-left: -6px; }
.left h1 { font-size: 44px; }
.left .foot { margin-top: 34px; font-size: 18px; font-weight: 500; color: #5e5e68; }
/* The cards end inside the tile, each between two blocks of the panel, so nothing is cut mid-line. */
.card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(to bottom, rgba(255,255,255,0), #fff); }
.c1 { left: 44px; top: 84px; height: 474px; }
.c2 { left: 254px; top: 130px; height: 424px; }
</style></head><body><div class="tile">
<div class="left">
  <img src="/brand/wordmark/forumind-wordmark-horizontal-on-light.svg" alt="Forumind">
  <h1>Your AI assistant<br>for the <span class="accent-text">comment section</span></h1>
  <ul><li>Summaries and follow-up chat</li><li>Ask the forum, with cited sources</li><li>Discourse, WordPress and Reddit</li></ul>
  <div class="foot">Free and open source Chrome extension</div>
</div>
<div class="right">
  <div class="card c1"><img src="/panels/marquee-summary.png" alt=""></div>
  <div class="card c2"><img src="/panels/marquee-agent.png" alt=""></div>
</div></div></body></html>
