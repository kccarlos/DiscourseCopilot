<!DOCTYPE html>
<!-- README screenshots: each element with an id is captured as one image by
     tools/ui/readme-shots.mjs; the panels/*.png it frames are rendered from dist/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>README screenshots</title>
<style>
  /* The panel's design language: zinc neutrals, one indigo accent, flat
     surfaces with hairlines, radii 8/10/12, the system UI font stack. */
  :root {
    --bg: #ffffff;
    --sunken: #f5f5f7;
    --line: #e4e4e7;
    --muted: #5e5e68;
    --accent-soft: #eef0ff;
    --dark-bg: #18181b;
    --dark-sunken: #111113;
    --dark-line: #2c2c31;
    --dark-muted: #a1a1aa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    display: inline-block;
    padding: 64px;
    /* Flat zinc with a faint indigo tint at the top. */
    background: linear-gradient(180deg, var(--accent-soft) 0%, var(--sunken) 62%);
  }

  /* ---- browser-style frame ---- */
  .frame {
    border-radius: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(24, 24, 27, 0.06), 0 16px 40px -20px rgba(24, 24, 27, 0.22);
    overflow: hidden;
  }
  .frame.dark {
    background: var(--dark-bg);
    border-color: #27272a;
  }
  .frame-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 12px;
    background: var(--sunken);
    border-bottom: 1px solid var(--line);
  }
  .frame.dark .frame-bar {
    background: var(--dark-sunken);
    border-bottom-color: var(--dark-line);
  }
  .frame-dot { width: 9px; height: 9px; border-radius: 50%; background: #d4d4d8; }
  .frame.dark .frame-dot { background: #3f3f46; }
  .frame-url {
    margin-left: 10px;
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .frame.dark .frame-url { background: var(--dark-bg); border-color: var(--dark-line); color: var(--dark-muted); }
  .frame-body { display: block; width: 100%; }
  .frame-body img { display: block; width: 100%; height: auto; }

  /* ---- hero: three side-panel viewports, question box at the bottom ---- */
  .hero {
    display: flex;
    align-items: flex-end;
    gap: 26px;
  }
  .hero .frame { width: 272px; flex: 0 0 auto; }
  .hero .frame.raised { transform: translateY(-28px); }

  /* ---- single feature frame ---- */
  .feature .frame { width: 400px; }
  .feature.wide .frame { width: 620px; }
</style>
</head>
<body>

  <div class="stage" id="heroStage">
    <div class="hero">
      <div class="frame">
        <div class="frame-bar">
          <span class="frame-dot red"></span><span class="frame-dot yellow"></span><span class="frame-dot green"></span>
          <span class="frame-url">meta.discourse.org</span>
        </div>
        <div class="frame-body"><img src="panels/meta-summary-light.png" alt=""></div>
      </div>
      <div class="frame raised">
        <div class="frame-bar">
          <span class="frame-dot red"></span><span class="frame-dot yellow"></span><span class="frame-dot green"></span>
          <span class="frame-url">community.openai.com</span>
        </div>
        <div class="frame-body"><img src="panels/openai-agent-tall-light.png" alt=""></div>
      </div>
      <div class="frame dark">
        <div class="frame-bar">
          <span class="frame-dot red"></span><span class="frame-dot yellow"></span><span class="frame-dot green"></span>
          <span class="frame-url">meta.discourse.org</span>
        </div>
        <div class="frame-body"><img src="panels/meta-chat-dark.png" alt=""></div>
      </div>
    </div>
  </div>

</body>
</html>
