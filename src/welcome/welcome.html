<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="welcome.title">Welcome to DiscourseCopilot</title>
  <link rel="icon" type="image/svg+xml" href="/brand/tab-icon-light.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/brand/tab-icon-dark.svg" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      color-scheme: light dark;
      --w-page: #f5f5f7;
      --w-bg: #ffffff;
      --w-ink: #18181b;
      --w-muted: #5e5e68;
      --w-line: #e4e4e7;
      --w-fill: #4f46e5;
      --w-fill-hover: #4338ca;
      --w-onfill: #ffffff;
      --w-ok: #15803d;
      --w-bad: #b42318;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --w-page: #111113;
        --w-bg: #18181b;
        --w-ink: #f4f4f5;
        --w-muted: #a1a1aa;
        --w-line: #2c2c31;
        --w-fill: #4f46e5;
        --w-fill-hover: #5b53ee;
        --w-onfill: #ffffff;
        --w-ok: #4ade80;
        --w-bad: #fda29b;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--w-page);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 48px 16px;
      background: var(--w-page);
      color: var(--w-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 22px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html:lang(zh-TW) body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 440px;
      padding: 36px 28px 28px;
      border: 1px solid var(--w-line);
      border-radius: 16px;
      background: var(--w-bg);
      text-align: center;
    }

    .logo {
      display: flex;
      width: 56px;
      height: 56px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--w-fill);
      color: var(--w-onfill);
    }

    .logo svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 8px 0 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 26px;
      letter-spacing: -0.015em;
    }

    p {
      margin: 0;
      color: var(--w-muted);
    }

    #openPanel {
      width: 100%;
      height: 48px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: var(--w-fill);
      color: var(--w-onfill);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    #openPanel:hover:not(:disabled) {
      background: var(--w-fill-hover);
    }

    #openPanel:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #openPanel:focus-visible {
      outline: 2px solid var(--w-fill);
      outline-offset: 2px;
    }

    #status {
      min-height: 20px;
      margin-top: 4px;
      color: var(--w-ok);
      font-size: 13px;
      line-height: 20px;
    }

    #status[data-type="error"] {
      color: var(--w-bad);
    }

    .tip {
      width: 100%;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--w-line);
      font-size: 13px;
      line-height: 19px;
    }

    @media (max-width: 420px) {
      body {
        padding: 24px 16px;
      }

      main {
        padding: 28px 20px 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="logo" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" focusable="false"><path d="M4 5h16v12H9l-5 4V5Z"/><path d="M8 9h8M8 13h5"/></svg></span>
    <h1 data-i18n="welcome.heading">Welcome to DiscourseCopilot</h1>
    <p data-i18n="welcome.lede">It works in Chrome's side panel, next to the forum you're reading. Open it to connect an AI provider; it takes about a minute.</p>
    <button id="openPanel" type="button" data-i18n="welcome.open">Open DiscourseCopilot</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="tip" data-i18n="welcome.pinTip">Tip: click the puzzle icon in Chrome's toolbar and pin DiscourseCopilot, so its icon is always one click away.</p>
  </main>
  <script type="module" src="./welcome.js"></script>
</body>
</html>
